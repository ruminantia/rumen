[DEFAULT]
# Default LLM provider settings
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.7
max_tokens = 2048
top_p = 0.9
thinking_enabled = false
search_enabled = false
retry_attempts = 3
retry_delay = 2

# API settings
api_host = 0.0.0.0
api_port = 8000
api_workers = 1

# File monitoring settings
monitor_interval = 5
file_timeout = 30
delete_input_files = true

# Output settings
output_format = markdown
output_directory = /app/bolus

[gemini]
# Gemini specific settings
# No additional headers needed for Gemini

[openai]
# OpenAI specific settings
base_url = https://api.openai.com/v1

[openrouter]
# OpenRouter specific settings
base_url = https://openrouter.ai/api/v1
http_referer =
x_title =

[deepseek]
# DeepSeek specific settings
base_url = https://api.deepseek.com/v1

[zai]
# ZAI/GLM specific settings
base_url = https://api.z.ai/api/paas/v4


# Folder-specific configurations
# Each section defines a folder to monitor and its specific prompt

# Forage - content filtering based on user preferences (filters harmful/inappropriate content)
[forage]
input_directory = /app/pastures
enabled = true
delete_input_files = false
system_prompt_file = prompts/forage_system.md
user_prompt_file = prompts/forage_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.3
max_tokens = 2048
output_format = markdown
output_directory = /app/output/forage
# Reject if the analysis outputs "DECISION: REJECT"
rejection_trigger_words = DECISION: REJECT
append_input_to_output = true

# Graze - scraped news/web articles (content extraction and cleaning)
[graze]
input_directory = /app/output/forage
enabled = true
delete_input_files = false
system_prompt_file = prompts/graze_system_v2.md
user_prompt_file = prompts/graze_user_v2.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.3
max_tokens = 8192
append_input_to_output = false
output_format = markdown
output_directory = /app/output/graze

# Ferment - content classification router (Full Story vs Blurb)
[ferment]
input_directory = /app/output/graze
enabled = true
delete_input_files = false
system_prompt_file = prompts/ferment_system.md
user_prompt_file = prompts/ferment_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.3
max_tokens = 2048
output_format = markdown
output_directory = /app/output/ferment
# Reject if decision is BLURB (archive as brief)
rejection_trigger_words = DECISION: BLURB
append_input_to_output = true

# Regurgitate - critique + research combined (verifies claims, gathers context, analyzes quality)
[regurgitate]
input_directory = /app/output/ferment
enabled = true
delete_input_files = false
system_prompt_file = prompts/regurgitate_system.md
user_prompt_file = prompts/regurgitate_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free:online
temperature = 0.4
max_tokens = 16384
search_enabled = true
output_format = markdown
output_directory = /app/output/regurgitate
append_input_to_output = false

# Remasticate - final news story writer (transforms researched material into publication-ready articles)
[remasticate]
input_directory = /app/output/regurgitate
enabled = true
delete_input_files = false
system_prompt_file = prompts/remasticate_system.md
user_prompt_file = prompts/remasticate_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.6
max_tokens = 4096
output_format = markdown
output_directory = /app/output/remasticate
append_input_to_output = false
