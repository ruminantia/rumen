[DEFAULT]
# Default LLM provider settings
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.7
max_tokens = 2048
top_p = 0.9
thinking_enabled = false
search_enabled = false
retry_attempts = 3
retry_delay = 2

# API settings
api_host = 0.0.0.0
api_port = 8000
api_workers = 1

# File monitoring settings
monitor_interval = 5
file_timeout = 30
delete_input_files = true

# Output settings
output_format = markdown
output_directory = /app/bolus

[gemini]
# Gemini specific settings
# No additional headers needed for Gemini

[openai]
# OpenAI specific settings
base_url = https://api.openai.com/v1

[openrouter]
# OpenRouter specific settings
base_url = https://openrouter.ai/api/v1
http_referer =
x_title =

[deepseek]
# DeepSeek specific settings
base_url = https://api.deepseek.com/v1

[zai]
# ZAI/GLM specific settings
base_url = https://api.z.ai/api/paas/v4


# Folder-specific configurations
# Each section defines a folder to monitor and its specific prompt

# Forage - content filtering based on user preferences (filters harmful/inappropriate content)
[forage]
input_directory = /app/pastures
enabled = true
delete_input_files = false
system_prompt_file = prompts/forage_system.md
user_prompt_file = prompts/forage_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.3
max_tokens = 2048
output_format = markdown
output_directory = /app/forage
# Reject if the analysis outputs "DECISION: REJECT"
rejection_trigger_words = DECISION: REJECT
# Append original input content to output (for next pipeline step)
append_input_to_output = true

# Graze - scraped news/web articles (content extraction and cleaning)
[graze]
input_directory = /app/forage
enabled = false
delete_input_files = false
system_prompt_file = prompts/graze_system.md
user_prompt_file = prompts/graze_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.3
max_tokens = 4096
append_input_to_output = true
output_format = markdown
output_directory = /app/bolus

# Chew - content critique and analysis (finds gaps, biases, logical issues)
[chew]
input_directory = /app/bolus/pastures
enabled = false
delete_input_files = false
system_prompt_file = prompts/chew_system.md
user_prompt_file = prompts/chew_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.4
max_tokens = 6144
output_format = markdown
output_directory = /app/bolus/chew

# Rehydrate - research with web search (fills gaps, verifies claims, gathers context)
[rehydrate]
input_directory = /app/bolus/chew
enabled = false
delete_input_files = false
system_prompt_file = prompts/rehydrate_system.md
user_prompt_file = prompts/rehydrate_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free:online
temperature = 0.3
max_tokens = 16384
output_format = markdown
output_directory = /app/bolus/rehydrate

# Distill - article synthesis from research (writes factual, non-sensationalized news stories)
[distill]
input_directory = /app/bolus/rehydrate
enabled = false
delete_input_files = false
system_prompt_file = prompts/distill_system.md
user_prompt_file = prompts/distill_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.5
max_tokens = 4096
output_format = markdown
output_directory = /app/bolus/distill
