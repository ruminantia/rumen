[DEFAULT]
# Default LLM provider settings
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.7
max_tokens = 2048
top_p = 0.9
thinking_enabled = false
search_enabled = false
retry_attempts = 3
retry_delay = 2

# API settings
api_host = 0.0.0.0
api_port = 8000
api_workers = 1

# File monitoring settings
monitor_interval = 5
file_timeout = 30
delete_input_files = true

# Output settings
output_format = markdown
output_directory = /app/bolus

[gemini]
# Gemini specific settings
# No additional headers needed for Gemini

[openai]
# OpenAI specific settings
base_url = https://api.openai.com/v1

[openrouter]
# OpenRouter specific settings
base_url = https://openrouter.ai/api/v1
http_referer =
x_title =

[deepseek]
# DeepSeek specific settings
base_url = https://api.deepseek.com/v1

[zai]
# ZAI/GLM specific settings
base_url = https://api.z.ai/api/paas/v4


# Folder-specific configurations
# Each section defines a folder to monitor and its specific prompt
[worldnews]
input_directory = /app/input/worldnews
enabled = false
system_prompt_file = prompts/worldnews_system.md
user_prompt_file = prompts/worldnews_user.md
provider = gemini
model = gemini-2.5-flash-lite
temperature = 0.3
max_tokens = 1024
output_format = markdown
# output_directory = /app/bolus/worldnews  # Uncomment to use custom output folder

[research]
input_directory = /app/input/research
enabled = false
system_prompt_file = prompts/research_system.md
user_prompt_file = prompts/research_user.md
provider = gemini
model = gemini-2.5-flash-lite
temperature = 0.5
max_tokens = 2048
output_format = markdown
# output_directory = /app/bolus/summarization  # Uncomment to use custom output folder

[summarization]
input_directory = /app/input/summarization
enabled = false
system_prompt_file = prompts/summarization_system.md
user_prompt_file = prompts/summarization_user.md
provider = gemini
model = gemini-2.5-flash-lite
temperature = 0.2
max_tokens = 2048
output_format = markdown
output_directory = /app/bolus/summarization

# Add more folder configurations as needed
# [custom_folder_name]
# input_directory = /app/input/custom_folder_name
# enabled = false
# system_prompt = Your custom system prompt
# user_prompt_template = Your custom user prompt template with {content} placeholder
# provider = gemini
# model = gemini-2.5-flash-lite
# temperature = 0.7
# max_tokens = 2048
# output_format = markdown
# output_directory = /app/bolus/custom_folder  # Uncomment to use custom output folder

# Forage - scraped news/web articles (content extraction and cleaning)
[forage]
input_directory = /app/pastures
enabled = true
delete_input_files = false
system_prompt_file = prompts/forage_system.md
user_prompt_file = prompts/forage_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.3
max_tokens = 4096
output_format = markdown
output_directory = /app/bolus/pastures

# Chew - content critique and analysis (finds gaps, biases, logical issues)
[chew]
input_directory = /app/bolus/pastures
enabled = true
delete_input_files = false
system_prompt_file = prompts/chew_system.md
user_prompt_file = prompts/chew_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.4
max_tokens = 6144
output_format = markdown
output_directory = /app/bolus/chew

# Rehydrate - research with web search (fills gaps, verifies claims, gathers context)
[rehydrate]
input_directory = /app/bolus/chew
enabled = true
delete_input_files = false
system_prompt_file = prompts/rehydrate_system.md
user_prompt_file = prompts/rehydrate_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free:online
temperature = 0.3
max_tokens = 16384
output_format = markdown
output_directory = /app/bolus/rehydrate

# Digest - article assembly from research (generates polished news articles)
[digest]
input_directory = /app/bolus/rehydrate
enabled = false
delete_input_files = false
system_prompt_file = prompts/digest_system.md
user_prompt_file = prompts/digest_user.md
provider = openrouter
model = nvidia/nemotron-3-nano-30b-a3b:free
temperature = 0.7
max_tokens = 8192
output_format = markdown
output_directory = /app/bolus/digest
